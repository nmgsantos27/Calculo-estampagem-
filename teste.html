<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TESTE - GrafiSantos</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f1f5f9; max-width: 500px; margin: 0 auto; }
        .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
        .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .field { flex: 1; min-width: 100px; }
        .field label { display: block; font-size: 12px; font-weight: bold; color: #475569; margin-bottom: 4px; }
        .field select, .field input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-success { background: #16a34a; color: #fff; }
        .btn-cancel { background: #94a3b8; color: #fff; }
        .btn-icon { width: 44px; height: 44px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .btn-icon-danger { border-color: #fca5a5; background: #fef2f2; color: #dc2626; }
        .hidden { display: none !important; }
        .form-panel { background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-top: 10px; }
        .form-panel input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 8px; font-size: 16px; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }
        .section-title { font-size: 14px; font-weight: bold; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        .debug { background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 6px; margin-bottom: 10px; display: none; font-size: 14px; }
        .info { background: #dbeafe; color: #1e40af; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="debug" id="debugErro"></div>

    <div class="card">
        <div class="section-title">📦 FORNECEDOR - TESTE</div>
        <div class="flex">
            <div class="field">
                <label>Selecionar:</label>
                <select id="selFornecedor" onchange="onChangeFornecedor()"></select>
            </div>
            <div style="display:flex;gap:4px;">
                <button class="btn-icon" onclick="abrirFormFornecedor(false)">+</button>
                <button class="btn-icon" onclick="abrirFormFornecedor(true)">✎</button>
                <button class="btn-icon btn-icon-danger" onclick="eliminarFornecedor()">✕</button>
            </div>
        </div>

        <div class="form-panel hidden" id="formFornecedor">
            <h4 id="tituloFornecedor">Novo fornecedor</h4>
            <input type="hidden" id="editFornecedorId">
            <input type="text" id="inputNomeFornecedor" placeholder="Nome do Fornecedor">
            <input type="number" id="inputPortesFornecedor" placeholder="Portes (€)" step="0.01">
            <div class="btn-row">
                <button class="btn btn-success" onclick="guardarFornecedor()">Guardar</button>
                <button class="btn btn-cancel" onclick="fecharFormFornecedor()">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">👕 MATERIAL - TESTE</div>
        <div class="flex">
            <div class="field">
                <label>Selecionar:</label>
                <select id="selMaterial" onchange="onChangeMaterial()"></select>
            </div>
            <div style="display:flex;gap:4px;">
                <button class="btn-icon" onclick="abrirFormMaterial(false)">+</button>
                <button class="btn-icon" onclick="abrirFormMaterial(true)">✎</button>
                <button class="btn-icon btn-icon-danger" onclick="eliminarMaterial()">✕</button>
            </div>
        </div>

        <div class="form-panel hidden" id="formMaterial">
            <h4 id="tituloMaterial">Novo material</h4>
            <input type="hidden" id="editMaterialId">
            <input type="text" id="inputNomeMaterial" placeholder="Nome do Material">
            <input type="number" id="inputPrecoMaterial" placeholder="Preço Base (€)" step="0.01">
            <div class="btn-row">
                <button class="btn btn-success" onclick="guardarMaterial()">Guardar</button>
                <button class="btn btn-cancel" onclick="fecharFormMaterial()">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">🖨️ TÉCNICA - TESTE</div>
        <div class="flex">
            <div class="field">
                <label>Selecionar:</label>
                <select id="selTecnica" onchange="onChangeTecnica()"></select>
            </div>
            <div style="display:flex;gap:4px;">
                <button class="btn-icon" onclick="abrirFormTecnica(false)">+</button>
                <button class="btn-icon" onclick="abrirFormTecnica(true)">✎</button>
                <button class="btn-icon btn-icon-danger" onclick="eliminarTecnica()">✕</button>
            </div>
        </div>

        <div class="form-panel hidden" id="formTecnica">
            <h4 id="tituloTecnica">Nova técnica</h4>
            <input type="hidden" id="editTecnicaId">
            <input type="text" id="inputNomeTecnica" placeholder="Nome da Técnica">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <input type="number" id="inputCustoMetro" placeholder="Custo/Metro" step="0.01">
                <input type="number" id="inputLarguraTecnica" placeholder="Largura (cm)" step="0.1">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <input type="number" id="inputAlturaTecnica" placeholder="Altura (cm)" step="0.1">
                <input type="number" id="inputCoresTecnica" placeholder="Nº Cores" min="1">
            </div>
            <div class="btn-row">
                <button class="btn btn-success" onclick="guardarTecnica()">Guardar</button>
                <button class="btn btn-cancel" onclick="fecharFormTecnica()">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="card">
        <p style="color:#64748b;font-size:14px;">✅ <strong id="statusFornecedor">Fornecedor: Nenhum</strong></p>
        <p style="color:#64748b;font-size:14px;">✅ <strong id="statusMaterial">Material: Nenhum</strong></p>
        <p style="color:#64748b;font-size:14px;">✅ <strong id="statusTecnica">Técnica: Nenhuma</strong></p>
    </div>

    <script>
        // ============================================================
        //  CONFIGURAÇÕES
        // ============================================================

        var STORAGE_KEY = "grafisantos_teste";
        var TAXA_IVA = 1.23;

        // ============================================================
        //  UTILITÁRIOS
        // ============================================================

        function parseNum(v) {
            if (typeof v === "number") return isFinite(v) ? v : 0;
            if (!v && v !== 0) return 0;
            var n = parseFloat(String(v).replace(",", "."));
            return isFinite(n) ? n : 0;
        }

        function gerarId() {
            return Date.now() + "_" + Math.random().toString(36).slice(2, 6);
        }

        // ============================================================
        //  DADOS PADRÃO
        // ============================================================

        var DADOS_PADRAO = {
            fornecedores: [{
                id: "f1",
                nome: "Roly",
                portes: 4.50,
                materiais: [
                    { id: "m1", nome: "T-Shirt Beagle 150g", preco: 1.85 },
                    { id: "m2", nome: "Polo Star 200g", preco: 5.20 },
                    { id: "m3", nome: "Hoodie Capuz Capuchana", preco: 9.80 }
                ]
            }, {
                id: "f2",
                nome: "Makito",
                portes: 6.00,
                materiais: [
                    { id: "m4", nome: "T-Shirt Tecnic Sport", preco: 1.45 },
                    { id: "m5", nome: "Saco Algodão Tabela", preco: 0.95 }
                ]
            }, {
                id: "f3",
                nome: "Levantar em Loja",
                portes: 0,
                materiais: [
                    { id: "m6", nome: "Material do Cliente", preco: 0 }
                ]
            }],
            tecnicas: [
                { id: "t1", nome: "DTF", custoMetro: 5.50, altura: 10, largura: 28, numCores: 1 },
                { id: "t2", nome: "Vinil Flex", custoMetro: 6.50, altura: 10, largura: 28, numCores: 1 },
                { id: "t3", nome: "Sublimação", custoMetro: 4.50, altura: 10, largura: 28, numCores: 1 },
                { id: "t4", nome: "Serigrafia", custoMetro: 0, altura: 10, largura: 0, numCores: 1 },
                { id: "t5", nome: "Bordado", custoMetro: 0, altura: 10, largura: 0, numCores: 1 }
            ]
        };

        // ============================================================
        //  ESTADO
        // ============================================================

        var dados = null;
        var fornecedorId = null;
        var materialId = null;
        var tecnicaId = null;

        // ============================================================
        //  PERSISTÊNCIA
        // ============================================================

        function carregarDados() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    var parsed = JSON.parse(raw);
                    if (parsed && parsed.fornecedores && parsed.tecnicas) {
                        dados = parsed;
                        return;
                    }
                }
            } catch (e) {}
            dados = JSON.parse(JSON.stringify(DADOS_PADRAO));
            guardarDados();
        }

        function guardarDados() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
            } catch (e) {}
        }

        // ============================================================
        //  ACESSORES
        // ============================================================

        function obterFornecedor(id) {
            return dados.fornecedores.find(function(f) { return f.id === id; });
        }

        function obterMaterial(id) {
            var f = obterFornecedor(fornecedorId);
            if (!f) return null;
            return f.materiais.find(function(m) { return m.id === id; });
        }

        function obterTecnica(id) {
            return dados.tecnicas.find(function(t) { return t.id === id; });
        }

        // ============================================================
        //  FORNECEDORES
        // ============================================================

        function renderFornecedores() {
            var sel = document.getElementById("selFornecedor");
            if (!sel) return;
            sel.innerHTML = "";

            dados.fornecedores.forEach(function(f) {
                var opt = document.createElement("option");
                opt.value = f.id;
                opt.textContent = f.nome + " (Portes: " + parseNum(f.portes).toFixed(2) + " €)";
                sel.appendChild(opt);
            });

            if (!fornecedorId || !obterFornecedor(fornecedorId)) {
                fornecedorId = dados.fornecedores[0] ? dados.fornecedores[0].id : null;
            }
            if (fornecedorId) sel.value = fornecedorId;

            var f = obterFornecedor(fornecedorId);
            document.getElementById("statusFornecedor").textContent = "Fornecedor: " + (f ? f.nome : "Nenhum");

            renderMateriais();
        }

        function onChangeFornecedor() {
            var sel = document.getElementById("selFornecedor");
            if (!sel) return;
            fornecedorId = sel.value;
            materialId = null;
            renderMateriais();
        }

        function abrirFormFornecedor(editar) {
            var f = obterFornecedor(fornecedorId);
            document.getElementById("formFornecedor").classList.remove("hidden");
            document.getElementById("tituloFornecedor").textContent = editar ? "✏️ Editar fornecedor" : "➕ Novo fornecedor";
            document.getElementById("editFornecedorId").value = editar && f ? f.id : "";
            document.getElementById("inputNomeFornecedor").value = editar && f ? f.nome : "";
            document.getElementById("inputPortesFornecedor").value = editar && f ? parseNum(f.portes) : "";
        }

        function fecharFormFornecedor() {
            document.getElementById("formFornecedor").classList.add("hidden");
        }

        function guardarFornecedor() {
            var nome = document.getElementById("inputNomeFornecedor").value.trim();
            if (!nome) { alert("⚠️ Indica o nome do fornecedor."); return; }

            var portes = Math.max(0, parseNum(document.getElementById("inputPortesFornecedor").value));
            var eid = document.getElementById("editFornecedorId").value;

            if (eid) {
                var f = obterFornecedor(eid);
                if (f) { f.nome = nome;
                    f.portes = portes; }
            } else {
                var novo = { id: gerarId(), nome: nome, portes: portes, materiais: [] };
                dados.fornecedores.push(novo);
                fornecedorId = novo.id;
            }

            guardarDados();
            fecharFormFornecedor();
            renderFornecedores();
        }

        function eliminarFornecedor() {
            if (!fornecedorId) return;
            if (dados.fornecedores.length <= 1) { alert("⚠️ É necessário manter pelo menos um fornecedor."); return; }

            var f = obterFornecedor(fornecedorId);
            if (!confirm("🗑️ Eliminar \"" + (f ? f.nome : "") + "\"?")) return;

            dados.fornecedores = dados.fornecedores.filter(function(x) { return x.id !== fornecedorId; });
            fornecedorId = null;
            materialId = null;
            guardarDados();
            renderFornecedores();
        }

        // ============================================================
        //  MATERIAIS
        // ============================================================

        function renderMateriais() {
            var sel = document.getElementById("selMaterial");
            if (!sel) return;
            sel.innerHTML = "";

            var f = obterFornecedor(fornecedorId);
            if (!f || !f.materiais || !f.materiais.length) {
                sel.innerHTML = '<option value="">⚠️ Nenhum material</option>';
                materialId = null;
                document.getElementById("statusMaterial").textContent = "Material: Nenhum";
                return;
            }

            f.materiais.forEach(function(m) {
                var opt = document.createElement("option");
                opt.value = m.id;
                opt.textContent = m.nome + " (" + parseNum(m.preco).toFixed(2) + " €)";
                sel.appendChild(opt);
            });

            if (!materialId || !obterMaterial(materialId)) {
                materialId = f.materiais[0] ? f.materiais[0].id : null;
            }
            if (materialId) sel.value = materialId;

            var m = obterMaterial(materialId);
            document.getElementById("statusMaterial").textContent = "Material: " + (m ? m.nome : "Nenhum");
        }

        function onChangeMaterial() {
            var sel = document.getElementById("selMaterial");
            if (!sel) return;
            materialId = sel.value;
            renderMateriais();
        }

        function abrirFormMaterial(editar) {
            var m = obterMaterial(materialId);
            document.getElementById("formMaterial").classList.remove("hidden");
            document.getElementById("tituloMaterial").textContent = editar ? "✏️ Editar material" : "➕ Novo material";
            document.getElementById("editMaterialId").value = editar && m ? m.id : "";
            document.getElementById("inputNomeMaterial").value = editar && m ? m.nome : "";
            document.getElementById("inputPrecoMaterial").value = editar && m ? parseNum(m.preco) : "";
        }

        function fecharFormMaterial() {
            document.getElementById("formMaterial").classList.add("hidden");
        }

        function guardarMaterial() {
            var f = obterFornecedor(fornecedorId);
            if (!f) return;

            var nome = document.getElementById("inputNomeMaterial").value.trim();
            if (!nome) { alert("⚠️ Indica o nome do material."); return; }

            var preco = Math.max(0, parseNum(document.getElementById("inputPrecoMaterial").value));
            var eid = document.getElementById("editMaterialId").value;

            f.materiais = f.materiais || [];

            if (eid) {
                var m = f.materiais.find(function(x) { return x.id === eid; });
                if (m) { m.nome = nome;
                    m.preco = preco; }
                materialId = eid;
            } else {
                var novo = { id: gerarId(), nome: nome, preco: preco };
                f.materiais.push(novo);
                materialId = novo.id;
            }

            guardarDados();
            fecharFormMaterial();
            renderMateriais();
        }

        function eliminarMaterial() {
            var f = obterFornecedor(fornecedorId);
            if (!f) return;
            if (!materialId) return;

            var m = f.materiais.find(function(x) { return x.id === materialId; });
            if (!confirm("🗑️ Eliminar \"" + (m ? m.nome : "") + "\"?")) return;

            f.materiais = f.materiais.filter(function(x) { return x.id !== materialId; });
            materialId = null;
            guardarDados();
            renderMateriais();
        }

        // ============================================================
        //  TÉCNICAS
        // ============================================================

        function renderTecnicas() {
            var sel = document.getElementById("selTecnica");
            if (!sel) return;
            sel.innerHTML = "";

            dados.tecnicas.forEach(function(t) {
                var opt = document.createElement("option");
                opt.value = t.id;
                var label = t.nome;
                if (t.largura > 0) label += " (" + parseNum(t.largura).toFixed(0) + "cm)";
                opt.textContent = label;
                sel.appendChild(opt);
            });

            if (!tecnicaId || !obterTecnica(tecnicaId)) {
                tecnicaId = dados.tecnicas[0] ? dados.tecnicas[0].id : null;
            }
            if (tecnicaId) sel.value = tecnicaId;

            var t = obterTecnica(tecnicaId);
            document.getElementById("statusTecnica").textContent = "Técnica: " + (t ? t.nome : "Nenhuma");
        }

        function onChangeTecnica() {
            var sel = document.getElementById("selTecnica");
            if (!sel) return;
            tecnicaId = sel.value;
            var t = obterTecnica(tecnicaId);
            document.getElementById("statusTecnica").textContent = "Técnica: " + (t ? t.nome : "Nenhuma");
        }

        function abrirFormTecnica(editar) {
            var t = obterTecnica(tecnicaId);
            document.getElementById("formTecnica").classList.remove("hidden");
            document.getElementById("tituloTecnica").textContent = editar ? "✏️ Editar técnica" : "➕ Nova técnica";
            document.getElementById("editTecnicaId").value = editar && t ? t.id : "";
            document.getElementById("inputNomeTecnica").value = editar && t ? t.nome : "";
            document.getElementById("inputCustoMetro").value = editar && t ? parseNum(t.custoMetro) : "";
            document.getElementById("inputAlturaTecnica").value = editar && t ? parseNum(t.altura) : "";
            document.getElementById("inputLarguraTecnica").value = editar && t ? parseNum(t.largura) : "";
            document.getElementById("inputCoresTecnica").value = editar && t ? (t.numCores || 1) : 1;
        }

        function fecharFormTecnica() {
            document.getElementById("formTecnica").classList.add("hidden");
        }

        function guardarTecnica() {
            var nome = document.getElementById("inputNomeTecnica").value.trim();
            if (!nome) { alert("⚠️ Indica o nome da técnica."); return; }

            var custoMetro = parseNum(document.getElementById("inputCustoMetro").value);
            var altura = parseNum(document.getElementById("inputAlturaTecnica").value);
            var largura = parseNum(document.getElementById("inputLarguraTecnica").value);
            var numCores = Math.max(1, parseInt(document.getElementById("inputCoresTecnica").value) || 1);
            var eid = document.getElementById("editTecnicaId").value;

            if (eid) {
                var t = obterTecnica(eid);
                if (t) { t.nome = nome;
                    t.custoMetro = custoMetro;
                    t.altura = altura;
                    t.largura = largura;
                    t.numCores = numCores; }
            } else {
                var novo = { id: gerarId(), nome: nome, custoMetro: custoMetro, altura: altura, largura: largura, numCores: numCores };
                dados.tecnicas.push(novo);
                tecnicaId = novo.id;
            }

            guardarDados();
            fecharFormTecnica();
            renderTecnicas();
        }

        function eliminarTecnica() {
            if (!tecnicaId) return;
            if (dados.tecnicas.length <= 1) { alert("⚠️ É necessário manter pelo menos uma técnica."); return; }

            var t = obterTecnica(tecnicaId);
            if (!confirm("🗑️ Eliminar \"" + (t ? t.nome : "") + "\"?")) return;

            dados.tecnicas = dados.tecnicas.filter(function(x) { return x.id !== tecnicaId; });
            tecnicaId = null;
            guardarDados();
            renderTecnicas();
        }

        // ============================================================
        //  INICIALIZAÇÃO
        // ============================================================

        document.addEventListener("DOMContentLoaded", function() {
            try {
                carregarDados();
                renderFornecedores();
                renderTecnicas();
            } catch (e) {
                var debug = document.getElementById("debugErro");
                if (debug) {
                    debug.style.display = "block";
                    debug.textContent = "❌ Erro: " + e.message;
                }
                console.log("Erro:", e);
            }
        });
    </script>

</body>
</html>
