<div class="db-actions">
  <button type="button" class="btn btn-sm btn-outline" onclick="alternarFormNovoArtigo()">+ Novo Artigo</button>
  <button type="button" class="btn btn-sm btn-danger-outline" onclick="eliminarArtigoAtivo()">🗑️ Eliminar</button>
</div>

<!-- FORMULÁRIO COM DISPLAY NONE POR DEFEITO -->
<div id="formNovoArtigo" class="novo-artigo-box" style="display: none;">
  <h4>Adicionar à Base de Dados</h4>
  <div class="form-group">
    <label for="novoNomeArtigo">Nome do Artigo:</label>
    <input type="text" id="novoNomeArtigo" placeholder="Ex: Hoody Unisexo Premium">
  </div>
  <div class="form-group">
    <label for="novoPrecoArtigo">Custo Fornecedor (s/ IVA):</label>
    <div class="input-symbol">
      <input type="number" id="novoPrecoArtigo" step="0.01" min="0" placeholder="0.00">
      <span>€</span>
    </div>
  </div>
  <div class="form-row">
    <button type="button" class="btn btn-sm btn-primary" onclick="guardarNovoArtigoBD()">Guardar</button>
    <button type="button" class="btn btn-sm btn-secondary" onclick="alternarFormNovoArtigo()">Cancelar</button>
  </div>
        </div>
