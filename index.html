<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>GrafiSantos Print</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #fff;
        }
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-fallback {
            font-size: 3rem;
            font-weight: 700;
            color: #1e293b;
        }
        .titulo {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .titulo span {
            color: #60a5fa;
        }
        .subtitulo {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-weight: 500;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }
        .botao-modulo {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s ease;
            cursor: pointer;
            touch-action: manipulation;
            backdrop-filter: blur(8px);
        }
        .botao-modulo:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        .botao-modulo:active {
            transform: scale(0.98);
        }
        .botao-modulo .icone {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .botao-modulo.stock .icone {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
        }
        .botao-modulo .texto {
            flex: 1;
            text-align: left;
        }
        .botao-modulo .texto .nome {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 3px;
            color: #fff;
        }
        .botao-modulo .texto .descricao {
            font-size: 0.78rem;
            color: #94a3b8;
            line-height: 1.3;
        }
        .botao-modulo .seta {
            font-size: 1.3rem;
            color: #64748b;
            transition: transform 0.2s;
        }
        .botao-modulo:hover .seta {
            transform: translateX(4px);
            color: #fff;
        }
        .footer {
            font-size: 0.7rem;
            color: #64748b;
            text-align: center;
            letter-spacing: 1px;
        }
        .footer strong {
            color: #94a3b8;
        }
        @media (max-width: 480px) {
            .logo {
                width: 100px;
                height: 100px;
            }
            .titulo {
                font-size: 1.5rem;
            }
            .botao-modulo {
                padding: 16px 20px;
            }
            .botao-modulo .icone {
                width: 48px;
                height: 48px;
                font-size: 1.5rem;
            }
            .botao-modulo .texto .nome {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="logo">
            <img src="icon-192.png" alt="GrafiSantos" onerror="this.style.display='none'; this.parentNode.innerHTML='<span class=\'logo-fallback\'>GS</span>';">
        </div>

        <h1 class="titulo">Grafi<span>Santos</span></h1>
        <p class="subtitulo">Print & Stock</p>

        <div class="menu">

            <a href="orcamentos.html" class="botao-modulo">
                <div class="icone">💰</div>
                <div class="texto">
                    <div class="nome">Orçamentos</div>
                    <div class="descricao">Calcular preços e gerir clientes</div>
                </div>
                <div class="seta">›</div>
            </a>

            <a href="stock.html" class="botao-modulo stock">
                <div class="icone">📦</div>
                <div class="texto">
                    <div class="nome">Stock de Material</div>
                    <div class="descricao">Controlar inventário e quantidades</div>
                </div>
                <div class="seta">›</div>
            </a>

        </div>

        <div class="footer">
            v1.0 · <strong>nmgsantos27</strong>
        </div>

    </div>

        <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(reg) {
                    console.log('✅ Service Worker registado');
                    setInterval(function() { reg.update(); }, 60000);
                }).catch(function(err) {
                    console.log('❌ Erro SW:', err);
                });

                var refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            });
        }
    </script>
